name: F11 release gate — issue 32

on:
  pull_request:
    paths:
      - '.github/workflows/f11-release-gate.yml'
      - 'scripts/f11-browser-e2e.py'
      - 'scripts/studio-ui-acceptance.py'
      - 'scripts/studio-navigation-perf.py'
      - 'scripts/studio-production-vitals.py'
      - 'scripts/f11-operations-e2e.py'
      - 'scripts/studio-populated-ui.py'
      - 'scripts/studio-quickcreate-e2e.py'
      - 'scripts/studio-stress-ui.py'
      - 'scripts/studio-resilience-ui.py'
      - 'scripts/f13-admin-e2e.py'
      - 'backend/**'
      - 'frontend/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/f11-release-gate.yml'
      - 'scripts/f11-browser-e2e.py'
      - 'scripts/f11-operations-e2e.py'
      - 'scripts/studio-populated-ui.py'
      - 'scripts/studio-quickcreate-e2e.py'
      - 'scripts/studio-stress-ui.py'
      - 'scripts/studio-resilience-ui.py'
      - 'scripts/f13-admin-e2e.py'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-verification:
    name: Node 24 F11 frontend lint, TypeScript, Vitest and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Types
        working-directory: frontend
        run: npm run typecheck
      - name: Regression suite
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  postgres-integration:
    name: Java 25 full Testcontainers and migration upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Confirm Docker is available for PostgreSQL 17
        run: docker info --format '{{.ServerVersion}}'
      - name: Full backend suite on isolated PostgreSQL Testcontainers
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-32-surefire-failure
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  real-browser-postgres:
    name: Chromium → Vite → Spring → disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate one-time local test credentials
        run: bash scripts/init-local-env.sh
      - name: Start fresh container stack with PostgreSQL 17
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real Chromium automation
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Execute destructive acceptance only against empty CI DB
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/f11-browser-e2e.py
      - name: Studio Analytics cross-route responsive and keyboard acceptance
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/studio-ui-acceptance.py
      - name: Studio authenticated navigation and request diagnostics
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/studio-navigation-perf.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build actual production frontend for Web Vitals diagnostics
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Start production preview with disposable backend
        run: |
          (cd frontend && npm run preview -- --host 127.0.0.1 --port 4173 > ../artifacts-preview.log 2>&1) &
          for n in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts-preview.log
          exit 1
      - name: Measure authenticated production navigation and browser vitals
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/studio-production-vitals.py
      - name: Lighthouse production login-page audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/studio-production
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/login \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=artifacts/studio-production/lighthouse-login-mobile.json \
            --quiet
      - name: Summarize Lighthouse findings and check contrast/console regressions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('artifacts/studio-production')
          data=json.loads((folder/'lighthouse-login-mobile.json').read_text())
          scores={key:round(value['score']*100) for key,value in data['categories'].items() if value.get('score') is not None}
          findings={}
          for key in ('color-contrast','errors-in-console','unused-javascript','valid-source-maps'):
              audit=data['audits'].get(key,{})
              findings[key]={'items':len(audit.get('details',{}).get('items',[])),'display':audit.get('displayValue')}
          (folder/'lighthouse-summary.json').write_text(json.dumps({
              'scope':'production login page, synthetic CI mobile audit (not authenticated app LCP)',
              'scores':scores,'findings':findings
          },indent=2),encoding='utf-8')
          print('Lighthouse login scores:',scores,'findings:',findings)
          assert not findings['color-contrast']['items'], 'Login contrast regression'
          assert not findings['errors-in-console']['items'], 'Login console/network errors'
          PY
      - name: Collect acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-32-browser-screenshots
          path: |
            artifacts/f11/
            artifacts/studio-ui/
            artifacts/studio-navigation/
            artifacts/studio-production/
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostic logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=100 postgres backend frontend || true
      - name: Destroy ephemeral test database
        if: always()
        run: docker compose down -v || true

  populated-operations-postgres:
    name: Purchase → receipts → sale → delivery → refund → Chromium closing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fresh one-time test credentials
        run: bash scripts/init-local-env.sh
      - name: Start independently isolated finance and inventory database
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and pinned Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      # F13 shares this disposable stack and existing Playwright install.
      # Admin fixtures do not touch financial/stock data, so the previously
      # verified F11 operations guard still requires empty business tables.
      - name: F13 real Chromium + Spring + PostgreSQL employee/RBAC acceptance
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/f13-admin-e2e.py
      - name: Run populated ChairX business operations acceptance
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/f11-operations-e2e.py
      - name: Verify populated Studio layouts and quick-view drawers
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/studio-populated-ui.py
          python scripts/studio-quickcreate-e2e.py
      - name: Studio stress UI long labels, paging, and API timing
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/studio-stress-ui.py
      - name: Studio failed-request recovery and list readiness smoke
        shell: bash
        env:
          CI: 'true'
          CHAIRX_F11_E2E_DISPOSABLE: I_UNDERSTAND_DATABASE_IS_DISPOSABLE
        run: |
          set -a
          source .env
          set +a
          python scripts/studio-resilience-ui.py
      - name: Upload purchase and settlement browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-32-operations-browser-screenshots
          path: |
            artifacts/issue32-operations/
            artifacts/studio-populated/
            artifacts/studio-quickcreate/
            artifacts/studio-stress/
            artifacts/studio-resilience/
            artifacts/f13/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show isolated stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 postgres backend frontend || true
      - name: Destroy disposable PostgreSQL and containers
        if: always()
        run: docker compose down -v || true

  historical-multiday-postgres:
    name: Two closed dates / late expense / RBAC / audit PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ensure isolated Docker/Testcontainers is available
        run: docker info --format '{{.ServerVersion}}'
      - name: Real HTTP Basic/CSRF/PostgreSQL historical multi-date acceptance
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress test
          -Dtest=DailyClosingMultiDayAcceptanceTest
      - name: Save failing multi-day report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue32-historical-multiday-failure
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  backup-restore-upgrade-contract:
    name: V40 pg_dump → fresh PG17 pg_restore → current Flyway fingerprints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Docker for isolated Postgres source and target
        run: docker info --format '{{.ServerVersion}}'
      - name: Exercise the REAL custom-dump restore/upgrade path on V40 fixtures
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress test
          '-Dtest=BackupUpgradeRehearsalTest'
      - name: Archive redacted JUnit failure report (NO backup contents)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue32-pgdump-restore-contract-failure
          path: backend/target/surefire-reports/TEST-kg.chairx.migration.BackupUpgradeRehearsalTest.xml
          if-no-files-found: ignore
          retention-days: 14
