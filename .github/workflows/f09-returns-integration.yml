name: F09 returns exchanges defects PostgreSQL integration

on:
  pull_request:
    paths:
      - 'frontend/src/features/returns/**'
      - 'frontend/src/test/returns.test.tsx'
      - 'docs/f09-returns-exchanges-defects.md'
      - '.github/workflows/f09-returns-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f09-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify isolated Docker engine for Testcontainers
        run: docker info --format '{{.ServerVersion}}'
      - name: Real PostgreSQL return/exchange/defect business invariants
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify
          -Dtest=ReturnApiTests,ReturnConcurrencyTests,ReturnTests,ExchangeWorkflowTests,ExchangeCreationTests,ExchangeSettlementTests,DefectTests,DefectOriginTests
      - name: Archive failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f09-testcontainers-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
