name: F01 lockfile initialization (temporary)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/frontend-bootstrap-lock.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/frontend-f01-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate npm lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile back to F01 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet || git commit -m "chore(frontend): lock npm dependencies"
          git push origin HEAD:refs/heads/feat/frontend-f01-foundation
