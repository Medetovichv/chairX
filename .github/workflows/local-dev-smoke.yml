name: Local development stack smoke

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.demo.yml'
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'docs/local-development.md'
      - 'scripts/**'
      - '.github/workflows/local-dev-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Generate ephemeral local credentials (never checked in)
        shell: bash
        run: |
          bash scripts/init-local-env.sh
          test -s .env
          before=$(sha256sum .env)
          bash scripts/init-local-env.sh
          test "$before" = "$(sha256sum .env)"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images and start database, API, UI
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Verify healthy stack, RBAC and persistent test users
        run: bash scripts/ci-local-smoke.sh

      - name: Show diagnostics after failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 postgres backend frontend || true

      - name: Stop without deleting PostgreSQL volume
        if: always()
        run: docker compose down || true

  demo-fixture-smoke:
    name: Demo database seeding, restart and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable local credentials
        run: bash scripts/init-local-env.sh
      - name: Verify demo Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet
      - name: Start isolated demo stack
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait --wait-timeout 240
      - name: Verify complete fixture version and inventory
        run: |
          D="docker compose -f docker-compose.yml -f docker-compose.demo.yml"
          $D exec -T postgres psql -U chairx -d chairx_demo -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN count(*)=3 THEN 'ok' ELSE 'fail' END FROM chairx_demo_seed_versions;" | grep -q '^ok$'
          $D exec -T postgres psql -U chairx -d chairx_demo -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN count(*)>=3 THEN 'ok' ELSE 'fail' END FROM products WHERE name LIKE 'DEMO%';" | grep -q '^ok$'
          $D exec -T postgres psql -U chairx -d chairx_demo -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN count(*)>=3 THEN 'ok' ELSE 'fail' END FROM purchases;" | grep -q '^ok$'
          $D exec -T postgres psql -U chairx -d chairx_demo -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN count(*)>=3 THEN 'ok' ELSE 'fail' END FROM sales;" | grep -q '^ok$'
          $D exec -T postgres psql -U chairx -d chairx_demo -Atc "SELECT count(*) FROM sales;" > /tmp/chairx-demo-sales-before
      - name: Recreate backend and prove idempotency
        run: |
          D="docker compose -f docker-compose.yml -f docker-compose.demo.yml"
          $D up -d --force-recreate --wait --wait-timeout 180 backend frontend
          $D exec -T postgres psql -U chairx -d chairx_demo -Atc "SELECT count(*) FROM sales;" > /tmp/chairx-demo-sales-after
          diff -u /tmp/chairx-demo-sales-before /tmp/chairx-demo-sales-after
      - name: Diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail=160 postgres backend || true
      - name: Cleanup without wiping persistent data
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down || true
